<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" >
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">

  <script src="login.js"></script>
</head>

<body class="bg-primary min-vh-100 py-4 d-flex flex-column justify-content-center align-items-center">
    <div class="text-center text-white mb-4">
        <div class="bg-white text-primary rounded p-2 d-inline-block mb-2">
            <i class="bi bi-shield-plus" style="font-size: 1.5rem;"></i>
        </div>
        <h3 class="fw-bold">MedPortal</h3>
    </div>
    <div class="card p-3 p-sm-4 shadow-sm" style="width: 100%; max-width: 400px; border-radius: 8px;">
        <h5 class="fw-bold">Bienvenido de nuevo</h5>
        <p class="text-muted" style="font-size: 0.9rem;">Por favor, autentíquese para acceder al portal de proveedores.</p>
        <form>
            <label for="username" class="mb-1" style="font-size: 0.9rem; font-weight: 600;">Nombre de Usuario:</label>
            <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" id="username" name="username" class="form-control border-start-0 ps-0" placeholder="Ingrese ID de admin" required>
            </div>
            <br>
            <label for="password" class="mb-1 mt-2" style="font-size: 0.9rem; font-weight: 600;">Contraseña:</label>
            <div class="input-group mb-2">
                <span class="input-group-text bg-white text-muted border-end-0">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="password" name="password" class="form-control border-start-0 border-end-0 px-0" placeholder="Ingrese Contraseña" required>
                <span class="input-group-text bg-white text-muted border-start-0" style="cursor: pointer;">
                    <i class="bi bi-eye"></i>
                </span>
            </div>
            <br>
            <button type="submit" class="btn btn-dark w-100 mt-3">Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-2"></i></button>
        </form>
        <div class="mt-4 p-3 rounded" style="background-color: #ebf3fb; font-size: 0.8rem; color: #4b5c74;">
            <i class="bi bi-shield-check text-primary"></i> <strong>Solo Acceso Seguro</strong> Este sistema es para personal medico autorizado. Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.
        </div>
    </div>
</body>
</html>
