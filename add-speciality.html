    <main class="content">
      <p class="subtitle">
        <a href="specialities.html">Especialidades</a> &rsaquo; Agregar Nueva Especialidad
      </p>
      <h1>Registrar Nueva Especialidad</h1>
      <p class="subtitle">Complete la información técnica y administrativa para dar de alta una especialidad médica.</p>

      <section class="card" style="padding: 1.5rem; max-width: 700px; margin-top: 1rem;">
        <form id="specialty-form">

          <div style="margin-bottom: 1rem;">
            <label for="input-nombre">Nombre de la Especialidad</label>
            <input type="text" id="input-nombre" class="input"
                   placeholder="Ej. Cardiología Intervencionista"
                   maxlength="15" required>
            <span id="error-nombre" style="color:red; font-size:0.8rem;"></span>
          </div>

          <div style="margin-bottom: 1rem;">
            <label for="input-descripcion">Descripción</label>
            <textarea id="input-descripcion" class="input"
                      placeholder="Detalle el alcance de la especialidad..."
                      maxlength="100" required
                      style="height: 120px; resize: vertical;"></textarea>
            <span id="error-descripcion" style="color:red; font-size:0.8rem;"></span>
          </div>

          <div class="actions" style="justify-content: flex-end;">
            <button type="button" id="cancel-btn" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Especialidad</button>
          </div>

        </form>
      </section>
    </main>
